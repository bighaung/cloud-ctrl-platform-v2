<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>多雲帳號總覽</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ── App Color System：深板岩 + 明確分類色 ── */
:root {
  /* 登入頁保持白底 — 用 .app-theme class 覆蓋 body */
  --bg:       #131928;
  --surface:  #1B2236;
  --surface2: #212B42;
  --surface3: #273252;
  --border:   rgba(255,255,255,0.07);
  --border2:  rgba(255,255,255,0.13);

  --text:  #F0F4FF;
  --text2: #A8B4D0;
  --text3: #7080A8;

  /* 阿里雲：亮橙 — 暖色，辨識度高 */
  --ali-accent: #FF8C00;
  --ali-light:  rgba(255,140,0,0.12);
  --ali-text:   #FFAB38;
  --ali-border: rgba(255,140,0,0.30);

  /* 騰訊雲：亮青藍 — 冷色，與橙色對比明顯 */
  --tc-accent: #00C8F0;
  --tc-light:  rgba(0,200,240,0.10);
  --tc-text:   #38D4F8;
  --tc-border: rgba(0,200,240,0.28);

  /* 狀態色：綠→黃→橙→紅 清晰梯度 */
  --ok:          #22C55E;
  --ok-bg:       rgba(34,197,94,0.13);
  --warn:        #EAB308;
  --warn-bg:     rgba(234,179,8,0.13);
  --danger:      #F97316;
  --danger-bg:   rgba(249,115,22,0.14);
  --critical:    #EF4444;
  --critical-bg: rgba(239,68,68,0.14);

  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;

  --shadow-sm: 0 2px 8px rgba(0,0,0,0.25);
  --shadow-md: 0 6px 20px rgba(0,0,0,0.32);
  --shadow-lg: 0 12px 40px rgba(0,0,0,0.40);

  --mono: 'SF Mono', 'Consolas', 'Fira Code', monospace;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", sans-serif;
  font-size: 16px;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.6;
}

/* ── Login ── */
.login-wrap {
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh;
  background: var(--bg);
}
.login-card {
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 22px;
  width: 460px;
  overflow: hidden;
  box-shadow: var(--shadow-lg);
}
/* 卡片頂部漸層 hero */
.login-hero {
  background: linear-gradient(140deg, #3B5BDB 0%, #6741D9 60%, #862E9C 100%);
  padding: 44px 44px 38px;
  display: flex; flex-direction: column; align-items: center;
  position: relative; overflow: hidden;
}
.login-hero::before {
  content: '';
  position: absolute; inset: 0;
  background: radial-gradient(ellipse at 70% 20%, rgba(255,255,255,0.12) 0%, transparent 55%),
              radial-gradient(ellipse at 20% 80%, rgba(0,0,0,0.20) 0%, transparent 50%);
}
.login-logo-icon {
  width: 58px; height: 58px; border-radius: 16px;
  background: rgba(255,255,255,0.15);
  border: 1px solid rgba(255,255,255,0.25);
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; margin-bottom: 14px; position: relative; z-index: 1;
  box-shadow: 0 4px 16px rgba(0,0,0,0.30);
}
.login-title    { font-size: 22px; font-weight: 700; color: #fff; letter-spacing: 0.2px; position: relative; z-index: 1; }
.login-subtitle { font-size: 14px; color: rgba(255,255,255,0.55); margin-top: 5px; position: relative; z-index: 1; }

/* 表單區 — 深色系 */
.login-form { padding: 32px 40px 38px; }
label { display: block; font-size: 12px; font-weight: 600; color: var(--text2); margin-bottom: 6px; margin-top: 20px; text-transform: uppercase; letter-spacing: 0.6px; }
label:first-child { margin-top: 0; }
input {
  width: 100%; padding: 12px 15px;
  border: 1px solid var(--border2);
  border-radius: 9px; font-size: 15px;
  background: var(--surface2); color: var(--text);
  outline: none; transition: border-color .2s, box-shadow .2s;
}
input::placeholder { color: var(--text3); }
input:focus { border-color: #5B7BF8; box-shadow: 0 0 0 3px rgba(91,123,248,0.20); }
.login-btn {
  width: 100%; margin-top: 26px; padding: 14px;
  background: linear-gradient(135deg, #3B5BDB 0%, #6741D9 100%);
  color: #fff; border: none; border-radius: 11px;
  font-size: 16px; font-weight: 700; cursor: pointer;
  transition: opacity .15s, transform .1s;
  box-shadow: 0 4px 14px rgba(59,91,219,0.40);
}
.login-btn:hover { opacity: .92; transform: translateY(-1px); }
.login-btn:active { transform: none; }
.login-err { color: var(--critical); font-size: 12px; margin-top: 8px; text-align: center; min-height: 18px; }

/* ── Header ── */
.page-header {
  background: var(--surface);
  border-bottom: 1px solid var(--border2);
  padding: 14px 28px;
  position: sticky; top: 0; z-index: 100;
  display: flex; align-items: center; gap: 22px; flex-wrap: wrap;
  box-shadow: 0 1px 0 rgba(255,255,255,0.04);
}
.page-logo { display: flex; align-items: center; gap: 10px; }
.page-logo-icon {
  width: 32px; height: 32px; border-radius: 9px;
  background: linear-gradient(135deg, #4B6BF5, #7C5CE6);
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
}
.page-title { font-size: 16px; font-weight: 700; color: var(--text); }

.summary-chips { display: flex; gap: 7px; flex-wrap: wrap; }
.chip {
  font-size: 13px; padding: 5px 14px; border-radius: 20px;
  border: 1px solid var(--border2);
  display: flex; align-items: center; gap: 6px;
  background: var(--surface2);
}
.chip-label { color: var(--text2); }
.chip-val { font-weight: 700; color: #FFFFFF; }
.chip-val.warn     { color: var(--warn); }
.chip-val.danger   { color: var(--danger); }
.chip-val.critical { color: var(--critical); }

.header-actions { margin-left: auto; display: flex; gap: 7px; align-items: center; }
#lastRefresh { font-size: 11px; color: var(--text3); }
.header-link {
  font-size: 12px; color: var(--text2); text-decoration: none;
  padding: 5px 12px; border: 1px solid var(--border2); border-radius: 7px;
  cursor: pointer; background: none;
  transition: background .15s, color .15s;
}
.header-link:hover { background: var(--surface2); color: var(--text); }

/* ── Urgent Expiry Banner ── */
.urgent-banner {
  background: linear-gradient(90deg, rgba(234,88,12,0.06) 0%, rgba(236,237,245,0) 70%);
  border-bottom: 1px solid rgba(234,88,12,0.14);
  padding: 10px 24px;
  display: flex; align-items: center; gap: 14px;
  overflow: hidden;
}
.urgent-banner-label {
  display: flex; align-items: center; gap: 7px;
  font-size: 11px; font-weight: 700; color: var(--danger);
  text-transform: uppercase; letter-spacing: 0.8px;
  white-space: nowrap; flex-shrink: 0;
}
.urgent-banner-label::before {
  content: '';
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--danger);
  box-shadow: 0 0 6px rgba(234,88,12,0.5);
  animation: pulse-dot 2s ease-in-out infinite;
}
.urgent-items {
  display: flex; gap: 8px; overflow-x: auto;
  scrollbar-width: none; flex: 1;
}
.urgent-items::-webkit-scrollbar { display: none; }
.urgent-item {
  flex-shrink: 0;
  background: var(--surface);
  border: 1px solid rgba(234,88,12,0.20);
  border-radius: 10px;
  padding: 7px 12px;
  display: flex; align-items: center; gap: 10px;
  box-shadow: var(--shadow-sm);
  transition: box-shadow .2s, border-color .2s;
  cursor: default;
}
.urgent-item:hover { border-color: rgba(234,88,12,0.38); box-shadow: var(--shadow-md); }
.urgent-item.is-critical {
  border-color: rgba(220,38,38,0.30);
  animation: pulse-border 2.5s ease-in-out infinite;
}
.urgent-item.is-critical:hover { border-color: rgba(220,38,38,0.55); }
.urgent-days {
  font-size: 20px; font-weight: 800; line-height: 1;
  font-family: var(--mono); color: var(--danger);
}
.urgent-item.is-critical .urgent-days { color: var(--critical); }
.urgent-days-unit { font-size: 9px; font-weight: 600; color: var(--text3); text-transform: uppercase; margin-top: 2px; }
.urgent-info { min-width: 0; }
.urgent-name { font-size: 12px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 140px; }
.urgent-acct { font-size: 10px; color: var(--text3); margin-top: 1px; }
.urgent-provider-dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }

/* ── Main Layout ── */
.main { max-width: 1400px; margin: 0 auto; padding: 28px 32px 60px; }
.provider-section { margin-bottom: 32px; }
.provider-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.provider-label {
  display: flex; align-items: center; gap: 7px;
  font-size: 11px; font-weight: 700; padding: 4px 13px;
  border-radius: 20px; letter-spacing: 0.5px; text-transform: uppercase;
}
.provider-label.ali { background: var(--ali-light); color: var(--ali-text); border: 1px solid var(--ali-border); }
.provider-label.tc  { background: var(--tc-light);  color: var(--tc-text);  border: 1px solid var(--tc-border); }
.provider-count { font-size: 12px; color: var(--text3); }
.provider-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.dot-ali { background: var(--ali-accent); }
.dot-tc  { background: var(--tc-accent); }

/* ── Account Card ── */
.account-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  margin-bottom: 10px;
  overflow: hidden;
  box-shadow: var(--shadow-sm);
  transition: box-shadow .2s, border-color .2s;
}
.account-card:hover { box-shadow: var(--shadow-md); border-color: var(--border2); }
.account-card.open  { box-shadow: var(--shadow-md); border-color: var(--border2); }

.account-header {
  display: flex; align-items: center; gap: 16px;
  padding: 20px 24px; cursor: pointer; user-select: none;
}
.acct-bar { width: 4px; height: 50px; border-radius: 3px; flex-shrink: 0; }
.acct-bar.ali { background: linear-gradient(180deg, #5B7BF8, #4B6BF5); }
.acct-bar.tc  { background: linear-gradient(180deg, #A78BFA, #8B5CF6); }

.acct-info { flex: 1; min-width: 0; }
.acct-name { font-size: 17px; font-weight: 700; color: #FFFFFF; }
.acct-id   { font-size: 13px; color: var(--text2); margin-top: 4px; font-family: var(--mono); }

.acct-meta { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.meta-item { text-align: right; }
.meta-label { font-size: 11px; color: var(--text2); margin-bottom: 3px; text-transform: uppercase; letter-spacing: 0.5px; }
.meta-val { font-size: 16px; font-weight: 700; color: #FFFFFF; }
.meta-val.cost { color: var(--ok); }

.expire-alert {
  font-size: 11px; font-weight: 600;
  padding: 4px 11px; border-radius: 20px; white-space: nowrap;
}
.expire-alert.danger   { background: var(--danger-bg);   color: var(--danger);   border: 1px solid rgba(234,88,12,0.22); }
.expire-alert.critical { background: var(--critical-bg); color: var(--critical); border: 1px solid rgba(220,38,38,0.22); }
.expire-alert.warn     { background: var(--warn-bg);     color: var(--warn);     border: 1px solid rgba(217,119,6,0.22); }

.toggle-btn { font-size: 16px; color: var(--text3); transition: transform .25s; flex-shrink: 0; padding: 4px; }
.account-card.open .toggle-btn { transform: rotate(180deg); }

/* ── Services Body ── */
.services-body { display: none; border-top: 1px solid var(--border); }
.account-card.open .services-body { display: block; }

.services-tabs {
  display: flex;
  border-bottom: 1px solid var(--border);
  padding: 0 18px;
  overflow-x: auto;
  background: var(--surface2);
  scrollbar-width: none;
}
.services-tabs::-webkit-scrollbar { display: none; }

.tab-btn {
  font-size: 13px; font-weight: 600;
  padding: 11px 16px; border: none; background: none;
  color: var(--text3); cursor: pointer;
  border-bottom: 2px solid transparent;
  white-space: nowrap; transition: color .15s;
}
.tab-btn:hover { color: var(--text2); }
.tab-btn.active { color: #FFFFFF; border-bottom-color: var(--ali-accent); }

.tab-count {
  display: inline-block; font-size: 10px; font-weight: 700;
  background: var(--surface); padding: 1px 6px;
  border-radius: 10px; margin-left: 5px; color: var(--text3);
  border: 1px solid var(--border2);
}
.tab-count.has-warn     { background: var(--warn-bg);   color: var(--warn);   border-color: rgba(217,119,6,0.25); }
.tab-count.has-danger   { background: var(--danger-bg); color: var(--danger); border-color: rgba(234,88,12,0.25); }

.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* ── Table ── */
table { width: 100%; border-collapse: collapse; }
thead th {
  font-size: 12px; font-weight: 600; color: var(--text3);
  text-align: left; padding: 11px 22px;
  background: var(--surface2);
  border-bottom: 1px solid var(--border);
  white-space: nowrap; text-transform: uppercase; letter-spacing: 0.5px;
}
tbody tr { border-bottom: 1px solid var(--border); transition: background .1s; }
tbody tr:last-child { border-bottom: none; }
tbody tr:hover { background: rgba(255,255,255,0.03); }

/* Highlight expiring rows */
tbody tr.row-critical { background: rgba(220,38,38,0.04); }
tbody tr.row-critical:hover { background: rgba(220,38,38,0.07); }
tbody tr.row-warn { background: rgba(217,119,6,0.04); }
tbody tr.row-warn:hover { background: rgba(217,119,6,0.07); }

td { padding: 12px 22px; font-size: 14px; color: var(--text); vertical-align: middle; }
.svc-name { font-weight: 600; color: #FFFFFF; }
.svc-id   { font-size: 12px; color: var(--text2); margin-top: 3px; font-family: var(--mono); }
.svc-spec { font-size: 13px; color: var(--text2); }

.status-badge {
  display: inline-block; font-size: 11px; font-weight: 600;
  padding: 3px 9px; border-radius: 20px;
}
.status-running  { background: var(--ok-bg);       color: var(--ok);       border: 1px solid rgba(5,150,105,0.22); }
.status-stopped  { background: var(--critical-bg); color: var(--critical); border: 1px solid rgba(220,38,38,0.22); }
.status-expiring { background: var(--danger-bg);   color: var(--danger);   border: 1px solid rgba(234,88,12,0.22); }

.expire-cell { white-space: nowrap; }
.expire-days {
  display: inline-block; font-size: 13px; font-weight: 700;
  padding: 3px 11px; border-radius: 20px; font-family: var(--mono);
}
.days-ok       { background: var(--ok-bg);       color: var(--ok);       border: 1px solid rgba(5,150,105,0.22); }
.days-warn     { background: var(--warn-bg);     color: var(--warn);     border: 1px solid rgba(217,119,6,0.25); }
.days-danger   { background: var(--danger-bg);   color: var(--danger);   border: 1px solid rgba(234,88,12,0.25); }
.days-critical { background: var(--critical-bg); color: var(--critical); border: 1px solid rgba(220,38,38,0.28); font-weight: 800; }
.days-na       { background: var(--surface2);    color: var(--text3);    border: 1px solid var(--border2); }

.empty-row td { text-align: center; color: var(--text3); padding: 32px; font-size: 13px; }
.table-wrap { overflow-x: auto; }

/* ── Sync bar ── */
.sync-bar {
  padding: 7px 18px; font-size: 11px; color: var(--text2);
  background: var(--surface2);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px;
}
.sync-btn {
  font-size: 11px; padding: 3px 10px;
  border: 1px solid var(--border2);
  border-radius: 6px; background: var(--surface);
  cursor: pointer; color: var(--text2);
  transition: background .15s, color .15s, box-shadow .15s;
}
.sync-btn:hover { background: var(--surface); color: var(--ali-text); border-color: var(--ali-border); box-shadow: var(--shadow-sm); }

/* ── Type chip ── */
.type-chip {
  font-size: 11px; padding: 2px 8px; border-radius: 6px;
  background: var(--surface2); color: var(--text2);
  border: 1px solid var(--border2); white-space: nowrap;
}

/* ── Misc ── */
.loading { text-align: center; padding: 60px 0; color: var(--text3); font-size: 14px; }
.no-sync  { padding: 24px 18px; color: var(--text3); font-size: 13px; text-align: center; }

/* ── Animations ── */
@keyframes pulse-dot {
  0%, 100% { opacity: 1; box-shadow: 0 0 6px rgba(234,88,12,0.5); }
  50%       { opacity: 0.5; box-shadow: 0 0 3px rgba(234,88,12,0.3); }
}
@keyframes pulse-border {
  0%, 100% { box-shadow: 0 0 0 0 rgba(220,38,38,0.20); }
  50%       { box-shadow: 0 0 0 3px rgba(220,38,38,0); }
}
</style>
</head>
<body>

<!-- Login -->
<div class="login-wrap" id="loginWrap" style="display:none">
  <div class="login-card">
    <div class="login-hero">
      <div class="login-logo-icon">☁</div>
      <div class="login-title">多雲帳號總覽</div>
      <div class="login-subtitle">Cloud Control Platform</div>
    </div>
    <div class="login-form">
      <label>帳號</label>
      <input type="text" id="loginEmail" placeholder="輸入帳號名稱或 Email">
      <label>密碼</label>
      <input type="password" id="loginPwd" placeholder="輸入密碼">
      <button class="login-btn" onclick="doLogin()">登入</button>
      <div class="login-err" id="loginErr"></div>
    </div>
  </div>
</div>

<!-- App -->
<div id="appWrap" style="display:none">
  <header class="page-header">
    <div class="page-logo">
      <div class="page-logo-icon">☁</div>
      <div class="page-title">多雲帳號總覽</div>
    </div>
    <div class="summary-chips">
      <div class="chip"><span class="chip-label">帳號</span><span class="chip-val" id="total-accounts">—</span></div>
      <div class="chip"><span class="chip-label">服務</span><span class="chip-val" id="total-services">—</span></div>
      <div class="chip"><span class="chip-label">30 天內到期</span><span class="chip-val warn" id="expiring-soon">—</span></div>
    </div>
    <div class="header-actions">
      <span id="lastRefresh"></span>
      <button class="header-link" onclick="loadData()">↺ 重新整理</button>
      <a href="admin.html" class="header-link">管理帳號</a>
      <button class="header-link" onclick="logout()">登出</button>
    </div>
  </header>

  <!-- Urgent expiry banner (rendered by JS) -->
  <div id="urgentBanner"></div>

  <main class="main" id="app">
    <div class="loading">載入中...</div>
  </main>
</div>

<script>
const API = `http://${location.hostname}:3001`;
let token = sessionStorage.getItem('token');

// ── Auto-sync ──
let _autoSyncTimer = null;

// ── 閒置自動登出（12 小時無操作）──
const IDLE_LIMIT = 12 * 60 * 60 * 1000;
let _lastActivity = Date.now();
let _idleTimer = null;

function resetIdleTimer() {
  _lastActivity = Date.now();
}

function startIdleWatch() {
  ['click', 'keydown', 'mousemove', 'scroll', 'touchstart'].forEach(evt =>
    document.addEventListener(evt, resetIdleTimer, { passive: true })
  );
  _idleTimer = setInterval(() => {
    if (token && Date.now() - _lastActivity >= IDLE_LIMIT) logout();
  }, 60 * 1000); // 每分鐘檢查一次
}

function stopIdleWatch() {
  if (_idleTimer) { clearInterval(_idleTimer); _idleTimer = null; }
  ['click', 'keydown', 'mousemove', 'scroll', 'touchstart'].forEach(evt =>
    document.removeEventListener(evt, resetIdleTimer)
  );
}

async function triggerSyncAll() {
  try {
    const res = await fetch(`${API}/api/accounts`, { headers: { 'Authorization': `Bearer ${token}` } });
    if (res.status === 401) { logout(); return; }   // token 過期 → 強制登出
    if (!res.ok) { loadData(); return; }            // 其他錯誤 → 至少刷新顯示
    const accounts = await res.json();
    await Promise.allSettled(
      accounts.map(a =>
        fetch(`${API}/api/accounts/${a.id}/sync`, { method: 'POST', headers: { 'Authorization': `Bearer ${token}` } })
      )
    );
    setTimeout(loadData, 6000);
  } catch(e) { /* 背景同步失敗不影響顯示 */ }
}

function startAutoSync() {
  triggerSyncAll();
  _autoSyncTimer = setInterval(triggerSyncAll, 60 * 60 * 1000);
}

function stopAutoSync() {
  if (_autoSyncTimer) { clearInterval(_autoSyncTimer); _autoSyncTimer = null; }
}

// ── Init ──
if (token) { showApp(); loadData(); startAutoSync(); startIdleWatch(); }
else       { document.getElementById('loginWrap').style.display = 'flex'; }

// ── Login ──
async function doLogin() {
  const account = document.getElementById('loginEmail').value.trim();
  const pwd     = document.getElementById('loginPwd').value;
  document.getElementById('loginErr').textContent = '';
  try {
    const res  = await fetch(`${API}/api/auth/login`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ account, password: pwd }) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || '登入失敗');
    token = data.token;
    sessionStorage.setItem('token', token);
    sessionStorage.setItem('userEmail', data.user?.email || account);
    showApp(); loadData(); startAutoSync(); startIdleWatch();
  } catch(e) { document.getElementById('loginErr').textContent = e.message; }
}
document.addEventListener('keydown', e => { if (e.key === 'Enter' && document.getElementById('loginWrap').style.display !== 'none') doLogin(); });

function logout() { stopAutoSync(); stopIdleWatch(); sessionStorage.clear(); token = null; location.reload(); }
function showApp() {
  document.getElementById('loginWrap').style.display = 'none';
  document.getElementById('appWrap').style.display = 'block';
}

// ── Helpers ──
function daysUntil(dateStr) {
  if (!dateStr) return null;
  return Math.ceil((new Date(dateStr) - new Date()) / 86400000);
}
function daysLabel(days) {
  if (days === null) return '<span class="expire-days days-na">長期</span>';
  if (days < 0)   return `<span class="expire-days days-critical">已到期 ${Math.abs(days)}天</span>`;
  if (days <= 7)  return `<span class="expire-days days-critical">剩 ${days} 天</span>`;
  if (days <= 30) return `<span class="expire-days days-danger">剩 ${days} 天</span>`;
  return `<span class="expire-days days-ok">剩 ${days} 天</span>`;
}
function rowClass(days) {
  if (days === null) return '';
  if (days <= 7)  return 'row-critical';
  if (days <= 30) return 'row-warn';
  return '';
}
function statusBadge(status, days) {
  const s = (status || '').toLowerCase();
  if (s === 'stopped' || s === 'stop') return '<span class="status-badge status-stopped">已停止</span>';
  if (days !== null && days <= 7) return '<span class="status-badge status-expiring">即將到期</span>';
  return '<span class="status-badge status-running">運行中</span>';
}
function formatDate(d) {
  if (!d) return '—';
  return new Date(d).toLocaleDateString('zh-TW', { year:'numeric', month:'2-digit', day:'2-digit' });
}
function tabCountBadge(list) {
  if (!list || list.length === 0) return `<span class="tab-count">0</span>`;
  let maxU = 'ok';
  list.forEach(s => {
    const d = daysUntil(s.expire);
    if (d !== null) {
      if (d <= 7) maxU = 'danger';
      else if (d <= 30 && maxU !== 'danger') maxU = 'warn';
    }
  });
  const cls = maxU === 'danger' ? 'has-danger' : maxU === 'warn' ? 'has-warn' : '';
  return `<span class="tab-count ${cls}">${list.length}</span>`;
}

// ── Parse rawData → services ──
function parseServices(rawData, provider) {
  if (!rawData) return null;
  const tabs = {};

  const ecsList = (rawData.ecs?.list || []).map(e => ({
    name:   e.name || e.InstanceName || e.id || '—',
    id:     e.id   || e.InstanceId   || '—',
    spec:   e.cpu  ? `${e.cpu}核 ${Math.round((e.memory||0)/1024)}G` : (e.InstanceType || '—'),
    status: e.status || e.Status || 'Running',
    expire: e.expireTime || e.ExpireTime || null,
  }));
  tabs[provider === 'TENCENT' ? 'CVM' : 'ECS'] = ecsList;

  const rdsList = (rawData.rds?.list || []).map(r => ({
    name:   r.name || r.DBInstanceDescription || r.id || '—',
    id:     r.id   || r.DBInstanceId || '—',
    spec:   r.engine ? `${r.engine} ${r.engineVersion || ''}`.trim() : (r.Engine ? `${r.Engine} ${r.EngineVersion||''} / ${r.DBInstanceClass||''}`.trim() : '—'),
    status: r.status || r.DBInstanceStatus || 'Running',
    expire: r.expireTime || r.ExpireTime || null,
  }));
  tabs[provider === 'TENCENT' ? 'CDB' : 'RDS'] = rdsList;

  const ossList = (rawData.oss?.list || []).map(b => ({
    name:   b.name || b.Name || '—',
    id:     b.location || b.Location || b.region || '—',
    spec:   '對象存儲',
    status: 'Running',
    expire: null,
  }));
  tabs[provider === 'TENCENT' ? 'COS' : 'OSS'] = ossList;

  const kvList = (rawData.kvstore?.list || []).map(k => ({
    name:   k.name || k.id || '—',
    id:     k.id   || '—',
    spec:   k.engine ? `${k.engine} ${k.type || ''}`.trim() : (k.type || 'Redis'),
    status: k.status || 'Normal',
    expire: k.expireTime || null,
  }));
  if (kvList.length > 0) tabs['Redis'] = kvList;

  const eipList = (rawData.eip?.list || []).map(e => ({
    name:   e.name || e.ip || '—',
    id:     e.id   || '—',
    spec:   `EIP · ${e.ip || '—'}`,
    status: e.status || 'InUse',
    expire: e.expireTime || null,
  }));
  if (eipList.length > 0) tabs['EIP'] = eipList;

  const cbsList = (rawData.cbs?.list || []).map(d => ({
    name:   d.name || d.id || '—',
    id:     d.id   || '—',
    spec:   d.spec || 'CBS',
    status: d.status || 'Running',
    expire: d.expireTime || null,
  }));
  if (cbsList.length > 0) tabs['CBS'] = cbsList;

  const PRODUCT_NAME = {
    ecs: '雲服務器 ECS', rds: '雲數據庫 RDS', redisa: 'Redis',
    kvstore: 'Redis', eip: '彈性公網 IP', sas: '雲安全中心',
    alimail: '雲郵箱', slb: '負載均衡 SLB', nat: 'NAT 閘道',
    polardb: 'PolarDB', mongodb: 'MongoDB', cdn: 'CDN',
    ddos: 'DDoS 防護', waf: 'WAF', oss: 'OSS',
    cvm: '雲服務器 CVM', cdb: '雲數據庫 CDB', cbs: '雲硬碟 CBS',
    tcredis: 'Redis（騰訊雲）', cospack: 'COS資源包',
  };
  const expiryMap = new Map();

  const isRealExpiry = t => t && new Date(t).getFullYear() < 2900;
  (rawData.subscriptions?.list || [])
    .filter(s => isRealExpiry(s.expireTime))
    .forEach(s => {
      const label = PRODUCT_NAME[s.productCode] || s.productName || s.productCode || '—';
      expiryMap.set(s.id, {
        name: label, id: s.id || '—', spec: s.region || '—',
        status: s.status || 'Normal', expire: s.expireTime, _type: label,
      });
    });

  const TAB_TYPE = {
    ECS: '雲服務器 ECS', RDS: '雲數據庫 RDS', Redis: 'Redis', EIP: '彈性公網 IP',
    CVM: '雲服務器 CVM', CDB: '雲數據庫 CDB', CBS: '雲硬碟 CBS',
  };
  Object.entries(TAB_TYPE).forEach(([tabKey, label]) => {
    (tabs[tabKey] || []).forEach(item => {
      if (isRealExpiry(item.expire) && item.id && !expiryMap.has(item.id)) {
        expiryMap.set(item.id, { ...item, _type: label });
      }
    });
  });

  const expirySource = [...expiryMap.values()]
    .filter(s => Math.ceil((new Date(s.expire) - Date.now()) / 86400000) > -60);
  expirySource.sort((a, b) => new Date(a.expire) - new Date(b.expire));
  if (expirySource.length > 0) tabs['到期總覽'] = expirySource;

  return tabs;
}

// ── Urgent Expiry Banner ──
function renderUrgentBanner(accounts) {
  const urgent = [];
  accounts.forEach(acct => {
    const snap = acct.snapshots?.[0];
    const raw  = snap?.rawData;
    if (!raw) return;
    const svc = parseServices(raw, acct.provider);
    (svc?.['到期總覽'] || []).forEach(s => {
      const d = daysUntil(s.expire);
      if (d !== null && d <= 30) {
        urgent.push({ ...s, _acctName: acct.name, _provider: acct.provider, _days: d });
      }
    });
  });

  const el = document.getElementById('urgentBanner');
  if (urgent.length === 0) { el.innerHTML = ''; return; }

  urgent.sort((a, b) => a._days - b._days);

  const items = urgent.map(u => {
    const isCritical = u._days <= 7;
    const providerDot = u._provider === 'ALIYUN'
      ? 'background:var(--ali-accent)' : 'background:var(--tc-accent)';
    const daysDisplay = u._days < 0
      ? `<span style="font-size:11px;color:var(--critical);font-weight:800">已到期</span>`
      : `<div class="urgent-days">${u._days}</div><div class="urgent-days-unit">天後到期</div>`;
    return `<div class="urgent-item ${isCritical ? 'is-critical' : ''}">
      <div style="text-align:center">
        ${daysDisplay}
      </div>
      <div class="urgent-info">
        <div class="urgent-name">${u._type || u.name}</div>
        <div class="urgent-acct" style="display:flex;align-items:center;gap:4px">
          <span class="urgent-provider-dot" style="${providerDot}"></span>
          ${u._acctName}
        </div>
      </div>
    </div>`;
  }).join('');

  el.innerHTML = `<div class="urgent-banner">
    <div class="urgent-banner-label">即將到期<br><span style="font-size:9px;letter-spacing:0.4px;opacity:0.7">${urgent.length} 項</span></div>
    <div class="urgent-items">${items}</div>
  </div>`;
}

// ── Render service table ──
function renderServiceTable(list, tabKey) {
  if (!list || list.length === 0) return `<table><tbody><tr class="empty-row"><td colspan="5">此帳號無 ${tabKey} 服務</td></tr></tbody></table>`;
  const isExpiry = tabKey === '到期總覽';
  const headers  = isExpiry
    ? '<th>服務類型</th><th>實例 ID</th><th>地區</th><th>到期日</th><th>剩餘時間</th>'
    : '<th>名稱 / ID</th><th>規格</th><th>狀態</th><th>到期日</th><th>剩餘時間</th>';
  return `<div class="table-wrap"><table>
    <thead><tr>${headers}</tr></thead>
    <tbody>${list.map(s => {
      const days = daysUntil(s.expire);
      const rc   = rowClass(days);
      if (isExpiry) {
        return `<tr class="${rc}">
          <td><span class="type-chip">${s._type || s.name || '—'}</span></td>
          <td><div class="svc-id" style="font-size:12px">${s.id}</div></td>
          <td style="color:var(--text3);font-size:12px">${s.spec || '—'}</td>
          <td class="expire-cell" style="color:var(--text3);font-size:12px">${formatDate(s.expire)}</td>
          <td>${daysLabel(days)}</td>
        </tr>`;
      }
      return `<tr class="${rc}">
        <td><div class="svc-name">${s.name}</div><div class="svc-id">${s.id}</div></td>
        <td class="svc-spec">${s.spec}</td>
        <td>${statusBadge(s.status, days)}</td>
        <td class="expire-cell" style="color:var(--text3);font-size:12px">${formatDate(s.expire)}</td>
        <td>${daysLabel(days)}</td>
      </tr>`;
    }).join('')}</tbody>
  </table></div>`;
}

// ── Render account card ──
function renderAccount(acct) {
  const p   = acct.provider;
  const cls = p === 'ALIYUN' ? 'ali' : 'tc';
  const snap = acct.snapshots?.[0];
  const raw  = snap?.rawData;
  const services = parseServices(raw, p);
  const syncTime = snap ? new Date(snap.snapAt).toLocaleString('zh-TW') : null;
  const accountIdDisplay = acct.aliyunAccountId || acct.tencentAppId || '—';

  let warnCount = 0, dangerCount = 0, criticalCount = 0;
  (services?.['到期總覽'] || []).forEach(s => {
    const d = daysUntil(s.expire);
    if (d !== null) {
      if (d <= 7)       criticalCount++;
      else if (d <= 30) dangerCount++;
    }
  });
  let alertBadge = '';
  if (criticalCount > 0)
    alertBadge = `<span class="expire-alert critical">⚠ ${criticalCount} 項 7 天內到期</span>`;
  else if (dangerCount > 0)
    alertBadge = `<span class="expire-alert danger">! ${dangerCount} 項 30 天內到期</span>`;

  const bal = raw?.balance;
  const _balNum = Number(bal?.availableAmount);
  const _invNum = Number(bal?.invoiceAmount);
  const balStr     = (bal?.availableAmount != null && !isNaN(_balNum)) ? `¥${_balNum.toFixed(2)}` : '—';
  const invoiceStr = (bal?.invoiceAmount   != null && !isNaN(_invNum)) ? `¥${_invNum.toFixed(2)}` : '—';

  const tabKeys = services
    ? ['到期總覽', ...Object.keys(services).filter(k => k !== '到期總覽')]
    : [];
  const cardId  = acct.id;

  return `<div class="account-card" id="card-${cardId}">
    <div class="account-header" onclick="toggleCard('${cardId}')">
      <div class="acct-bar ${cls}"></div>
      <div class="acct-info">
        <div class="acct-name">${acct.name}</div>
        <div class="acct-id">${p === 'ALIYUN' ? '阿里雲' : '騰訊雲'} · ${accountIdDisplay} · ${acct.region}</div>
        ${alertBadge || acct._count?.alerts > 0 ? `<div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap">${alertBadge}${acct._count?.alerts > 0 ? `<span class="expire-alert critical">${acct._count.alerts} 個警報</span>` : ''}</div>` : ''}
      </div>
      <div class="acct-meta">
        <div class="meta-item">
          <div class="meta-label">帳戶餘額</div>
          <div class="meta-val cost">${balStr}</div>
        </div>
        <div class="meta-item">
          <div class="meta-label">可開票金額</div>
          <div class="meta-val" style="color:var(--text2)">${invoiceStr}</div>
        </div>
      </div>
      <div class="toggle-btn">⌄</div>
    </div>
    <div class="services-body" id="body-${cardId}">
      ${syncTime
        ? `<div class="sync-bar">上次同步：${syncTime} <button class="sync-btn" onclick="syncAccount('${cardId}', event)">立即同步</button></div>`
        : `<div class="sync-bar" style="color:var(--warn)">尚未同步 <button class="sync-btn" onclick="syncAccount('${cardId}', event)">立即同步</button></div>`
      }
      ${services && tabKeys.length > 0 ? `
        <div class="services-tabs" id="tabs-${cardId}">
          ${tabKeys.map((k, i) => `<button class="tab-btn ${i===0?'active':''}" onclick="switchTab('${cardId}','${k}',this)">${k}${tabCountBadge(services[k])}</button>`).join('')}
        </div>
        ${tabKeys.map((k, i) => `<div class="tab-panel ${i===0?'active':''}" id="panel-${cardId}-${k}">${renderServiceTable(services[k], k)}</div>`).join('')}
      ` : `<div class="no-sync">點擊「立即同步」以載入服務資料</div>`}
    </div>
  </div>`;
}

// ── Load data ──
async function loadData() {
  document.getElementById('app').innerHTML = '<div class="loading">載入中...</div>';
  try {
    const res  = await fetch(`${API}/api/accounts`, { headers: { 'Authorization': `Bearer ${token}` } });
    if (res.status === 401) { logout(); return; }
    const accounts = await res.json();
    renderAll(accounts);
    document.getElementById('lastRefresh').textContent = `更新於 ${new Date().toLocaleTimeString('zh-TW')}`;
  } catch(e) {
    document.getElementById('app').innerHTML = `<div class="loading" style="color:var(--critical)">載入失敗：${e.message}</div>`;
  }
}

function renderAll(accounts) {
  const ali = accounts.filter(a => a.provider === 'ALIYUN');
  const tc  = accounts.filter(a => a.provider === 'TENCENT');

  let totalSvc = 0, expiringSoon = 0;
  accounts.forEach(a => {
    const snap = a.snapshots?.[0];
    const raw  = snap?.rawData;
    if (raw) {
      const svc = parseServices(raw, a.provider);
      if (svc) {
        Object.entries(svc).forEach(([key, list]) => {
          if (key !== '到期總覽') totalSvc += list.length;
        });
        (svc['到期總覽'] || []).forEach(s => {
          const d = daysUntil(s.expire);
          if (d !== null && d >= 0 && d <= 30) expiringSoon++;
        });
      }
    }
  });

  // Update header chips
  document.getElementById('total-accounts').textContent = accounts.length;
  document.getElementById('total-services').textContent  = totalSvc;
  const el = document.getElementById('expiring-soon');
  el.textContent = expiringSoon;
  el.className = expiringSoon > 0 ? 'chip-val danger' : 'chip-val';

  // Render urgent banner
  renderUrgentBanner(accounts);

  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="provider-section">
      <div class="provider-header">
        <div class="provider-label ali"><span class="provider-dot dot-ali"></span>阿里雲帳號</div>
        <span class="provider-count">${ali.length} 個主帳號</span>
      </div>
      ${ali.length ? ali.map(renderAccount).join('') : '<p style="color:var(--text3);font-size:13px;padding:8px 0">尚未新增阿里雲帳號 — <a href="admin.html" style="color:var(--ali-accent)">前往管理</a></p>'}
    </div>
    <div class="provider-section">
      <div class="provider-header">
        <div class="provider-label tc"><span class="provider-dot dot-tc"></span>騰訊雲帳號</div>
        <span class="provider-count">${tc.length} 個主帳號</span>
      </div>
      ${tc.length ? tc.map(renderAccount).join('') : '<p style="color:var(--text3);font-size:13px;padding:8px 0">尚未新增騰訊雲帳號 — <a href="admin.html" style="color:var(--tc-accent)">前往管理</a></p>'}
    </div>`;

  document.querySelector('.account-card')?.classList.add('open');
}

// ── Interactions ──
function toggleCard(id) { document.getElementById('card-' + id).classList.toggle('open'); }
function switchTab(accountId, tabKey, btn) {
  const body = document.getElementById('body-' + accountId);
  body.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  body.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById(`panel-${accountId}-${tabKey}`).classList.add('active');
}
async function syncAccount(id, evt) {
  evt.stopPropagation();
  const btn = evt.target;
  btn.disabled = true; btn.textContent = '同步中...';
  try {
    await fetch(`${API}/api/accounts/${id}/sync`, { method:'POST', headers:{ 'Authorization': `Bearer ${token}` } });
    setTimeout(loadData, 3000);
  } finally { btn.disabled = false; btn.textContent = '立即同步'; }
}
</script>
